name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/github-project-hosting-kjui1f
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Note: enablement: true doesn't help here — creating the Pages site is
      # not something GITHUB_TOKEN is allowed to do. Turn Pages on once under
      # Settings → Pages (see README) and this step just picks it up.
      - uses: actions/configure-pages@v5

      # The site is plain static HTML — publish the repo root as-is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
