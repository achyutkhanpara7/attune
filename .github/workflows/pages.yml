name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/github-project-hosting-kjui1f
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement turns Pages on for the repo the first time this runs,
      # so no manual step in Settings is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain static HTML — publish the repo root as-is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
